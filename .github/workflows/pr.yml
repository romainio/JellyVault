name: PR

on:
  pull_request:

defaults:
  run:
    shell: bash

env:
  BUILD_DIRS_ARTIFACT: build-dirs
  # Private repositories get 7 GB runners: one 5 GB Gradle JVM that also compiles Kotlin (no separate Kotlin daemon)
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1024m'"
  KOTLIN_IN_PROCESS: "-Pkotlin.compiler.execution.strategy=in-process"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
    - name: Run pre-commit
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build app
        id: buildapp
        run: |
          ./gradlew $KOTLIN_IN_PROCESS clean assembleDefaultDebug testDefaultDebugUnitTest --no-daemon
          apks=$(find app/build/outputs \( -name '*.apk' -or -name '*.aab' \) -print0 | tr '\0' ',' | sed 's/,$//')
          echo "apks=$apks" >> "$GITHUB_OUTPUT"
