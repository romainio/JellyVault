name: Create release

on:
  push:
    tags:
      - v*

defaults:
  run:
    shell: bash

env:
  APK_SHORT_NAME: JellyVault.apk
  # Private repositories get 7 GB runners: one 5 GB Gradle JVM that also compiles Kotlin (no separate Kotlin daemon)
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1024m'"
  KOTLIN_IN_PROCESS: "-Pkotlin.compiler.execution.strategy=in-process"
  TAG_NAME: ${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build app
        id: buildapp
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
        run: |
          # APKs only: the appstore/firetv bundles are not published anywhere yet
          ./gradlew $KOTLIN_IN_PROCESS clean assembleDefaultRelease
      - name: Verify signatures
        run: |
          echo "Verify APK signatures"
          find app/build/outputs \( -name '*.apk' -or -name '*.aab' \)
          find app/build/outputs \( -name '*.apk' \) -print0 | xargs -0 -n1 ${{env.ANDROID_SDK_ROOT}}/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner verify --verbose --print-certs
      - name: Copy APK to shorter names
        id: apks
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' line; do
              # JellyVault-default-release-1.1.0-100-arm64-v8a.apk => JellyVault-arm64-v8a.apk
              short_name="$(echo $line | sed -E 's/-default-release-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+//')"
              echo "$line => $short_name"
              cp "$line" "$short_name"
            done
      - name: Checksums
        run: |
          echo "SHA256 checksums:"
          find app/build/outputs \( -name '*.apk' -or -name '*.aab' \) -print0 | xargs -0 sha256sum
      - name: Upload mapping files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mapping
          path: |
            app/build/outputs/**/mapping.txt
          compression-level: 6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar

          gh release create "${{ env.TAG_NAME }}" \
            --latest --title "${{ env.TAG_NAME }}" --verify-tag -n "" --draft \
            app/build/outputs/apk/**/*.apk
